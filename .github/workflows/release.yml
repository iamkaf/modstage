name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/modstage dist/modstage
          tar -C dist -czf modstage-linux-x86_64.tar.gz modstage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            modstage-linux-x86_64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Modstage ${{ inputs.tag }}" \
            --notes "Linux x86_64 binary for Modstage."
