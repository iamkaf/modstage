name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Read Package Version
        run: |
          version="$(cargo pkgid --package modstage | sed 's/.*#//')"
          echo "MODSTAGE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "MODSTAGE_TAG=v${version}" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/modstage dist/modstage
          tar -C dist -czf modstage-linux-x86_64.tar.gz modstage

      - name: Push Release Tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$MODSTAGE_TAG" >/dev/null; then
            echo "Tag $MODSTAGE_TAG already exists."
          else
            git tag "$MODSTAGE_TAG" "$GITHUB_SHA"
            git push origin "$MODSTAGE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$MODSTAGE_TAG" \
            modstage-linux-x86_64.tar.gz \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Modstage $MODSTAGE_VERSION" \
            --notes "Linux x86_64 binary for Modstage."
